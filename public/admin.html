<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OMI Idle Farm Admin</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span>⚙️ OMI</span> ADMIN</div><div class="top-actions"><a href="/" style="color:#ddd">← Játék</a><button class="ghost" id="adminLogout">Kilépés</button></div></header>
<main>
<section class="hero card"><div><div class="eyebrow">ADMIN PANEL</div><h1>OMI Idle Farm kezelőfelület</h1><p>Játékosok, mentések, tiltások, jutalmak és ranglista ellenőrzése.</p></div><div class="hero-power"><small>JÁTÉKOSOK</small><strong id="playerCount">0</strong></div></section>
<nav class="tabs" style="position:static;margin:12px 0"><button class="tab active" data-a="players">👥 Játékosok</button><button class="tab" data-a="logs">📜 Admin napló</button></nav>
<section class="page active" id="a-players"><section class="card"><div class="title-row"><h2>👥 Játékosok</h2><button id="refreshPlayers">↻ Frissítés</button></div><div id="players"></div></section></section>
<section class="page" id="a-logs"><section class="card"><h2>📜 Admin műveletek</h2><div id="logs"></div></section></section>
</main>
<div class="modal" id="playerModal"><div class="modal-box" style="width:min(650px,100%)"><button class="modal-x" id="playerClose">×</button><h2 id="pmName">Játékos</h2><div id="pmStats" class="stats-panel"></div><hr><h3>🎁 Jutalom hozzáadása</h3><div style="display:grid;grid-template-columns:1fr 1fr auto;gap:7px"><select id="grantType"><option value="gold">Arany</option><option value="gems">Kristály</option><option value="ore">Érc</option><option value="soul">Lélekkő</option><option value="tickets">Dungeon jegy</option></select><input id="grantAmount" type="number" min="0" value="1000"><button id="grantBtn">Hozzáadás</button></div><hr><div style="display:flex;gap:7px;flex-wrap:wrap"><button id="banBtn" class="danger">Tiltás</button><button id="resetBtn" class="danger">Mentés teljes reset</button></div></div></div>
<div id="toast"></div><script src="admin.js"></script></body></html>
